name: Track prices

on:
  schedule:
    - cron: "0 14 * * *"   # 7:00 AM Pacific
    - cron: "0 2 * * *"    # 7:00 PM Pacific
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: price-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        run: |
          python tracker.py
          python make_chart.py

      - name: Commit new data
        run: |
          git config user.name "price-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ product_map.json report.md chart.html .categories_cache.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "prices: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
